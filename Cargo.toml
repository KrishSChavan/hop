[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hop-types = { path = "crates/hop-types" }
hop-proto = { path = "crates/hop-proto" }
hop-keymap = { path = "crates/hop-keymap" }
hop-core = { path = "crates/hop-core" }
hop-config = { path = "crates/hop-config" }
hop-platform = { path = "crates/hop-platform" }
hop-platform-macos = { path = "crates/hop-platform-macos" }
hop-platform-windows = { path = "crates/hop-platform-windows" }
hop-selftest = { path = "crates/hop-selftest" }
hop-net = { path = "crates/hop-net" }

anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
keycode = "1.0.0"
proptest = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"

# macOS bindings
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

# Windows bindings
windows = "0.62.2"
