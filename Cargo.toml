[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hop-types = { path = "crates/hop-types" }
hop-proto = { path = "crates/hop-proto" }
hop-keymap = { path = "crates/hop-keymap" }
hop-core = { path = "crates/hop-core" }
hop-config = { path = "crates/hop-config" }
hop-platform = { path = "crates/hop-platform" }

anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
keycode = "1.0.0"
proptest = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
