name: CI

# Windows runs on every push. macOS is tested locally on each change, and
# private repos bill macOS runner minutes at 10x, so it runs only on demand.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS
        type: boolean
        default: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.macos && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
