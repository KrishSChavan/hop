[package]
name = "hop-agent"
description = "The Hop agent as a library: sharing, pairing, settings and the hop command line, for the hop command and the Hop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hop-config.workspace = true
hop-core.workspace = true
hop-keymap.workspace = true
hop-net.workspace = true
hop-platform.workspace = true
hop-selftest.workspace = true
hop-types.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# The async runtime the network layer runs on (MIT), at the exact version
# hop-net uses. `signal` turns Ctrl+C, SIGTERM and SIGHUP (and, on Windows,
# closing the console) into a request to quit, so `hop run` gives the
# keyboard and mouse back before it exits instead of being killed
# mid-session. Pairing runs on it too, in the terminal and in the app.
tokio = { version = "=1.53.3", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# Wipes the pairing code from memory after use (Apache-2.0 OR MIT), the
# version hop-net uses.
zeroize = "=1.9.1"

[dev-dependencies]
# Only to build the `PeerUp` events a fake network hands the agent in tests.
hop-proto.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hop-platform-macos.workspace = true

[target.'cfg(windows)'.dependencies]
hop-platform-windows.workspace = true
