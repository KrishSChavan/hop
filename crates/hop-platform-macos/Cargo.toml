[package]
name = "hop-platform-macos"
description = "Hop's macOS backend: Quartz event taps and event posting, cursor control, displays, the clipboard, the drop zone, permissions, an AppKit test window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hop-keymap.workspace = true
hop-platform.workspace = true
hop-types.workspace = true

# The OS bindings exist only on macOS; elsewhere this crate is empty.
#
# The workspace takes these crates with their default features, which already
# include everything below. The features this crate relies on are still listed,
# so the build keeps working if the workspace ever trims the defaults.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true, features = ["std", "objc2"] }
objc2 = { workspace = true, features = ["std"] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSDragging",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    # The methods that take or return a CGFloat (colours, fonts, sizes).
    "objc2-core-foundation",
] }
objc2-application-services = { workspace = true, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFCGTypes",
    "CFDate",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
] }
