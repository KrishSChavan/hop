[package]
name = "hop-platform-macos"
description = "Hop's macOS backend: Quartz event taps and event posting, cursor control, displays, permissions, an AppKit test window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hop-keymap.workspace = true
hop-platform.workspace = true
hop-types.workspace = true

# The OS bindings exist only on macOS; elsewhere this crate is empty.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-application-services.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
